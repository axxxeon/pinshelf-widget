
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PinShelf Widget</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: white;
    }

    body {
      padding: 4px;
    }

    #status {
      padding: 10px;
      color: #666;
      font-size: 13px;
    }

    #board-container {
      width: 100%;
      min-height: 400px;
      overflow-y: auto;
      overflow-x: hidden;
    }

    #board {
      width: 320px;
      max-width: 100%;
      margin: 0 auto;
    }
  </style>
</head>

<body>

  <div id="status">Loading Pinterest board...</div>

  <div id="board-container">
    <div id="board"></div>
  </div>

  <!-- Configure the widget before loading Pinterest's script -->
  <script>
    const params = new URLSearchParams(window.location.search);

    const boardUrl = params.get("board");
    const requestedLayout = params.get("layout") || "3";

    const status = document.getElementById("status");
    const board = document.getElementById("board");

    // Layout settings established during our standalone tests.
    const layoutWidths = {
      "1": 190,
      "2": 120,
      "3": 92
    };

    const selectedLayout = Object.prototype.hasOwnProperty.call(
      layoutWidths,
      requestedLayout
    ) ? requestedLayout : "3";

    const thumbnailWidth = layoutWidths[selectedLayout];

    function validateBoardUrl(value) {
      let url;

      try {
        url = new URL(value);
      } catch {
        throw new Error("Invalid Pinterest board URL.");
      }

      const allowedHosts = [
        "pinterest.com",
        "www.pinterest.com",
        "in.pinterest.com"
      ];

      const parts = url.pathname.split("/").filter(Boolean);

      if (
        url.protocol !== "https:" ||
        !allowedHosts.includes(url.hostname) ||
        parts.length !== 2
      ) {
        throw new Error("Invalid Pinterest board URL.");
      }

      return `https://www.pinterest.com/${parts[0]}/${parts[1]}/`;
    }

    try {
      if (!boardUrl) {
        throw new Error("No Pinterest board URL provided.");
      }

      const cleanUrl = validateBoardUrl(boardUrl);

      // Create the Pinterest board embed.
      const link = document.createElement("a");

      link.href = cleanUrl;
      link.setAttribute("data-pin-do", "embedBoard");

      link.setAttribute("data-pin-board-width", "320");
      link.setAttribute("data-pin-scale-height", "600");
      link.setAttribute(
        "data-pin-scale-width",
        String(thumbnailWidth)
      );

      board.appendChild(link);

      status.textContent =
        "Loading Pinterest board · " +
        selectedLayout +
        " column layout...";

    } catch (error) {
      status.textContent = error.message;
    }
  </script>

  <!-- Load Pinterest only after the embed has been configured -->
  <script
    async
    defer
    src="https://assets.pinterest.com/js/pinit.js"
    onload="document.getElementById('status').textContent = 'Pinterest script loaded.';"
    onerror="document.getElementById('status').textContent = 'Could not load Pinterest widget.';"
  ></script>

</body>
</html>
